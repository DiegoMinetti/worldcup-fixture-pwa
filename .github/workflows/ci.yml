name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install & Typecheck backend
        run: |
          cd backend
          npm ci
          npm run typecheck

      - name: Install & Build frontend
        run: |
          cd frontend
          npm ci
          npm run typecheck
          npm run build
